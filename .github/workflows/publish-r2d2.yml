name: Publish R2-D2 deliverables
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-r2d2.yml
      - r2d2/infra/**
      - r2d2/output/delivery/**
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: r2d2-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-r2d2-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.DEPLOY_AWS_ACCOUNT }}
      - name: Deploy storage and HTTPS delivery
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name robots-r2d2-deliverables --template-file r2d2/infra/deliverables.yaml --no-fail-on-empty-changeset --tags Project=robots CostCenter=home-iot Environment=prod ManagedBy=sam DeployedVia=github-actions Owner=jeremy
          aws cloudformation describe-stacks --stack-name robots-r2d2-deliverables --query 'Stacks[0].Outputs' --output json > /tmp/r2d2-outputs.json
      - name: Upload and verify final artifacts when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f r2d2/output/delivery/manifest.json ]]; then
            echo 'Infrastructure is ready. No final R2-D2 files have been published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd r2d2/output/delivery
          python - <<'PY'
          import hashlib,json,pathlib
          manifest=json.loads(pathlib.Path('manifest.json').read_text())
          assert set(manifest['files']) == {'motion.mp4','design.pdf'}
          for name,sha in manifest['files'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==sha,name
          PY
          bucket=$(jq -r '.[]|select(.OutputKey=="Bucket")|.OutputValue' /tmp/r2d2-outputs.json)
          distribution=$(jq -r '.[]|select(.OutputKey=="Distribution")|.OutputValue' /tmp/r2d2-outputs.json)
          base=$(jq -r '.[]|select(.OutputKey=="BaseUrl")|.OutputValue' /tmp/r2d2-outputs.json)
          for name in motion.mp4 design.pdf; do
            type=application/pdf
            [[ "$name" != motion.mp4 ]] || type=video/mp4
            sha=$(sha256sum "$name" | cut -d' ' -f1)
            aws s3 cp "$name" "s3://$bucket/r2d2/revision-c/$name" --content-type "$type" --content-disposition inline --cache-control 'public,max-age=300' --checksum-algorithm SHA256 --metadata "sha256=$sha" --only-show-errors
          done
          invalidation=$(aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/r2d2/revision-c/motion.mp4' '/r2d2/revision-c/design.pdf' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$distribution" --id "$invalidation"
          for name in motion.mp4 design.pdf; do
            curl --fail --silent --show-error --retry 2 "$base/$name" -o "/tmp/$name"
            cmp "$name" "/tmp/$name"
            printf '%s\n' "$base/$name" >> "$GITHUB_STEP_SUMMARY"
            sha256sum "$name" >> "$GITHUB_STEP_SUMMARY"
          done
          code=$(curl -sS -H 'Range: bytes=0-1023' -D /tmp/range.headers -o /tmp/range.bin -w '%{http_code}' "$base/motion.mp4")
          test "$code" = 206
          test "$(wc -c < /tmp/range.bin)" = 1024
          grep -qi '^content-type: video/mp4' /tmp/range.headers
          curl --fail --silent --head "$base/design.pdf" | grep -qi '^content-type: application/pdf'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://$bucket.s3.us-east-1.amazonaws.com/r2d2/revision-c/motion.mp4")" = 403
          test "$(curl -sS -o /dev/null -w '%{http_code}' "https://$bucket.s3.us-east-1.amazonaws.com/?list-type=2")" = 403
          echo 'PASS: public downloads match committed bytes; video ranges work; S3 stays private.' >> "$GITHUB_STEP_SUMMARY"
