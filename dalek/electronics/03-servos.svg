<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510">
<style>text{font-family:Arial,sans-serif;fill:#10263a} .title{font-size:30px;font-weight:bold} .head{font-size:20px;font-weight:bold} .body{font-size:17px} .small{font-size:15px} .net{font-family:monospace;font-size:16px;fill:#004879} .wire{stroke:#155a85;stroke-width:2;fill:none}</style>
<rect width="1600" height="1510" fill="white"/>
<text x="35" y="45" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#10263a">03 / Four arm servos and head PWM routing</text>
<text x="35" y="77" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">All chip numbers below are DIP-14 PHYSICAL pin numbers. U8/U9 are 74AHCT125, not 74HC125.</text>
<rect x="35" y="115" width="740" height="185" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="50" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">U10 / Adafruit PCA9685 #815</text>
<text x="50" y="171" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">VCC &lt;-3V3; GND &lt;-common ground; SDA21; SCL22</text>
<text x="50" y="195" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Address0x40;50Hz pins0..3 -&gt;U8;V+ UNCONNECTED</text>
<text x="50" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Remove OE pull-down; R6 10k OE to3V3; GPIO27 -&gt;OE</text>
<text x="50" y="243" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Firmware sets/reads MODE2=0x06 (OUTDRV1 / OUTNE10)</text>
<text x="50" y="267" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">OE HIGH: outputs high-Z; R7/R8 disable both head gates</text>
<text x="50" y="291" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Pins4/5 are STATIC direction enables, not servo pulses.</text>
<rect x="825" y="115" width="725" height="185" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="840" y="143" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">U8 and U9: two DIFFERENT supplies</text>
<text x="840" y="171" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">U8.14 -&gt;5V_SERVO; U9.14 -&gt;5V_MOTOR; both pin7 -&gt;GND</text>
<text x="840" y="195" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">C8 at U8; C9 at U9:100nF directly across14 and7.</text>
<text x="840" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">U8 pins1,4,10,13 -&gt;SERVO_DISABLE (GPIO27).</text>
<text x="840" y="243" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">U9 pins1/4 -&gt;PCA4/5; each has10k pull-up to3V3.</text>
<text x="840" y="267" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">U9 unused:9/12 -&gt;GND;10/13 -&gt;5V_MOTOR;8/11 open.</text>
<text x="840" y="291" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">AHCT tolerates 3.3V input with its own supply off.</text>
<rect x="35" y="355" width="335" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="50" y="383" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">PWM0 / LEFT_YAW</text>
<text x="50" y="411" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">U10.PWM0 -&gt; U8 pin2</text>
<text x="50" y="435" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">R20 10k: input toGND</text>
<path d="M370,409 L455,409" stroke="#155a85" stroke-width="2" fill="none"/>
<rect x="455" y="355" width="465" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="470" y="383" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">U8 74AHCT125</text>
<text x="470" y="411" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Input pin2 -&gt; internal buffer -&gt; output pin3</text>
<text x="470" y="435" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">pin3 -&gt; R30 220ohm -&gt; signal</text>
<path d="M920,409 L1005,409" stroke="#155a85" stroke-width="2" fill="none"/>
<rect x="1005" y="355" width="545" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="1020" y="383" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">SV0 / MG92B #2307 / inside shoulder</text>
<text x="1020" y="411" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">SIGNAL &lt;- R30; R40 10k SIGNAL toGND</text>
<text x="1020" y="435" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">RED &lt;-5V_SERVO; BLACK/BROWN &lt;-GND</text>
<rect x="35" y="482" width="335" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="50" y="510" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">PWM1 / LEFT_PITCH</text>
<text x="50" y="538" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">U10.PWM1 -&gt; U8 pin5</text>
<text x="50" y="562" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">R21 10k: input toGND</text>
<path d="M370,536 L455,536" stroke="#155a85" stroke-width="2" fill="none"/>
<rect x="455" y="482" width="465" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="470" y="510" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">U8 74AHCT125</text>
<text x="470" y="538" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Input pin5 -&gt; internal buffer -&gt; output pin6</text>
<text x="470" y="562" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">pin6 -&gt; R31 220ohm -&gt; signal</text>
<path d="M920,536 L1005,536" stroke="#155a85" stroke-width="2" fill="none"/>
<rect x="1005" y="482" width="545" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="1020" y="510" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">SV1 / MG92B #2307 / inside shoulder</text>
<text x="1020" y="538" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">SIGNAL &lt;- R31; R41 10k SIGNAL toGND</text>
<text x="1020" y="562" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">RED &lt;-5V_SERVO; BLACK/BROWN &lt;-GND</text>
<rect x="35" y="609" width="335" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="50" y="637" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">PWM2 / RIGHT_YAW</text>
<text x="50" y="665" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">U10.PWM2 -&gt; U8 pin9</text>
<text x="50" y="689" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">R22 10k: input toGND</text>
<path d="M370,663 L455,663" stroke="#155a85" stroke-width="2" fill="none"/>
<rect x="455" y="609" width="465" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="470" y="637" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">U8 74AHCT125</text>
<text x="470" y="665" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Input pin9 -&gt; internal buffer -&gt; output pin8</text>
<text x="470" y="689" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">pin8 -&gt; R32 220ohm -&gt; signal</text>
<path d="M920,663 L1005,663" stroke="#155a85" stroke-width="2" fill="none"/>
<rect x="1005" y="609" width="545" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="1020" y="637" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">SV2 / MG92B #2307 / inside shoulder</text>
<text x="1020" y="665" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">SIGNAL &lt;- R32; R42 10k SIGNAL toGND</text>
<text x="1020" y="689" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">RED &lt;-5V_SERVO; BLACK/BROWN &lt;-GND</text>
<rect x="35" y="736" width="335" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="50" y="764" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">PWM3 / RIGHT_PITCH</text>
<text x="50" y="792" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">U10.PWM3 -&gt; U8 pin12</text>
<text x="50" y="816" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">R23 10k: input toGND</text>
<path d="M370,790 L455,790" stroke="#155a85" stroke-width="2" fill="none"/>
<rect x="455" y="736" width="465" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="470" y="764" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">U8 74AHCT125</text>
<text x="470" y="792" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Input pin12 -&gt; internal buffer -&gt; output pin11</text>
<text x="470" y="816" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">pin11 -&gt; R33 220ohm -&gt; signal</text>
<path d="M920,790 L1005,790" stroke="#155a85" stroke-width="2" fill="none"/>
<rect x="1005" y="736" width="545" height="102" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="1020" y="764" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">SV3 / MG92B #2307 / inside shoulder</text>
<text x="1020" y="792" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">SIGNAL &lt;- R33; R43 10k SIGNAL toGND</text>
<text x="1020" y="816" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">RED &lt;-5V_SERVO; BLACK/BROWN &lt;-GND</text>
<rect x="35" y="880" width="740" height="255" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="50" y="908" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">U9 / head direction selects the PWM route</text>
<text x="50" y="936" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">GPIO2 -&gt; U9.2 AND U9.5; R24 10k GPIO2 toGND</text>
<text x="50" y="960" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">PCA4 -&gt; U9.1 (/OE); R7 10k PCA4 to3V3</text>
<text x="50" y="984" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">PCA5 -&gt; U9.4 (/OE); R8 10k PCA5 to3V3</text>
<text x="50" y="1008" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">U9.3 -&gt; R34 220ohm -&gt; U11.AIN1</text>
<text x="50" y="1032" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">U9.6 -&gt; R35 220ohm -&gt; U11.AIN2</text>
<text x="50" y="1056" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">R44/R45 10k: each U11 input toGND</text>
<text x="50" y="1080" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Forward: PCA4 LOW / PCA5 HIGH; reverse opposite</text>
<text x="50" y="1104" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">PWM=0 before gate changes; both gates disabled first</text>
<rect x="825" y="880" width="725" height="255" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="840" y="908" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">U11 / added DRV8833 #3297 / head motor</text>
<text x="840" y="936" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">VMotor &lt;-5V_MOTOR; GND &lt;-star; SLP &lt;-GPIO12</text>
<text x="840" y="960" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">AOUT1/AOUT2 -&gt; fifth TT3777 motor + / -</text>
<text x="840" y="984" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">C_HEAD 100nF across motor tabs; twist22AWG pair</text>
<text x="840" y="1008" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">C12 470uF/10V: VMotor(+) toGND(-) at driver</text>
<text x="840" y="1032" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Keep stock0.2ohm sense resistors:1A bridge limit</text>
<text x="840" y="1056" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">BIN1/BIN2 -&gt;GND; BOUT1/BOUT2 left open</text>
<text x="840" y="1080" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">FLT/VM/ASEN/BSEN: no external connection</text>
<text x="840" y="1104" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">63mm TT wheel contacts head track; mount stays fixed</text>
<rect x="35" y="1170" width="1515" height="140" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="50" y="1198" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">Head stop, reversal and preload adjustment</text>
<text x="50" y="1226" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">20kHz PWM from GPIO2; maximum100/255. PCA outputs4/5 use full-on/full-off bits, independent of50Hz servo pulses.</text>
<text x="50" y="1250" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Reversal ramps to zero, coasts100ms, then ramps up. Zero command, timeout, physical OFF or I2C fault removes PWM.</text>
<text x="50" y="1274" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Adjust wheel contact with power OFF. Use only enough pressure to turn the dome; retain intentional slip under obstruction.</text>
<text x="50" y="1298" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">No position or speed feedback. The head can coast after power removal. No wiring enters the rotating head.</text>
<rect x="35" y="1345" width="1515" height="105" rx="6" fill="#f1f7fb" stroke="#46677d" stroke-width="1.5"/>
<text x="50" y="1373" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#10263a">Arm calibration</text>
<text x="50" y="1401" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Test1500us with horns removed; fit horns at center. Begin at +/-2 degrees and0.10Hz; check every hidden linkage.</text>
<text x="50" y="1425" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#10263a">Default AND maximum radius:8 degrees. Normal frequency0.40Hz. Keep all four servos inside the shoulder.</text>
<text x="35" y="1486" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#10263a">DALEK ROUND / FRICTION | 2026-09-12 | Circuit + wiring.csv form one drawing set | Physical validation required</text>
</svg>