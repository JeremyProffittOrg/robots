[platformio]
default_envs = tdisplay

[env:tdisplay]
platform = espressif32@6.5.0
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    adafruit/Adafruit VL53L1X@3.1.2
    adafruit/Adafruit LIS3DH@1.3.0
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.16.1
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000

; Host build of the behaviour only. include/controller.h has no Arduino dependency, so the
; obstacle policy and both gestures are tested without a door.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Iinclude
test_build_src = no
