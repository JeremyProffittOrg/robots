<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#ffffff"/>
<text x="30" y="38" font-family="sans-serif" font-size="28" text-anchor="start" fill="#142337">R2-24 | revision D power distribution (DFRobot Romeo ESP32-S3 DFR0994)</text>
<text x="30" y="70" font-family="sans-serif" font-size="17" text-anchor="start" fill="#142337">Architecture view. Follow wiring.csv and the connection sheets for exact pins and returns.</text>
