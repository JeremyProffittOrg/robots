<text x="105.0" y="176" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#142337">LiFePO4</text>
<rect x="240" y="115" width="100" height="70" rx="5" fill="#e5effb" stroke="#173e73" stroke-width="2"/>
