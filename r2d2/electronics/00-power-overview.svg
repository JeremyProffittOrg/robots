<text x="35" y="295" font-family="sans-serif" font-size="18" text-anchor="start" fill="#142337">Five UBEC positive outputs remain separate.</text>
<text x="35" y="344" font-family="sans-serif" font-size="18" text-anchor="start" fill="#142337">TT motors never connect to the 12 V post rail.</text>
<text x="35" y="393" font-family="sans-serif" font-size="18" text-anchor="start" fill="#142337">Seven DRV8833 channels retain nominal 1 A limits.</text>
<text x="35" y="442" font-family="sans-serif" font-size="18" text-anchor="start" fill="#142337">D5 uses replacement R1 = 71.5k.</text>
<text x="35" y="491" font-family="sans-serif" font-size="18" text-anchor="start" fill="#142337">NC limits independently gate post direction inputs.</text>
<text x="35" y="540" font-family="sans-serif" font-size="18" text-anchor="start" fill="#142337">Ground drive and head stop during posture changes.</text>
<text x="35" y="589" font-family="sans-serif" font-size="18" text-anchor="start" fill="#142337">Unplug the pack before charging or USB service.</text>
<text x="35" y="638" font-family="sans-serif" font-size="18" text-anchor="start" fill="#142337">Remove J_USB before connecting computer USB.</text>
<path d="M105 195 V810 H1360" fill="none" stroke="#173e73" stroke-width="3"/>
<text x="160" y="793" font-family="sans-serif" font-size="18" text-anchor="start" fill="#142337">GND: common battery, regulator, driver, controller and servo returns.</text>
<text x="30" y="858" font-family="sans-serif" font-size="17" text-anchor="start" fill="#142337">Fuses are on converter inputs. MAIN off removes all supply power. RUN off removes every motor and servo branch.</text>
</svg>